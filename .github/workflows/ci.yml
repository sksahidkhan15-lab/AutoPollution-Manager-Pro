name: AutoPollution Pro CI / Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: backend/package.json

    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    - name: Verify No Secrets Committed
      run: |
        ! git grep -i "rzp_live_" -- ':!*.example' ':!docs/*'
        ! git grep -i "AIzaSy" -- ':!*.example' ':!docs/*' ':!frontend/js/firebase-config.js'

    - name: Validate Frontend HTML/JS/CSS Files
      run: |
        test -f frontend/index.html
        test -f frontend/dashboard.html
        test -f frontend/vehicles.html
        test -f frontend/reminders.html
        test -f frontend/settings.html
        test -f frontend/admin.html
        test -f frontend/css/style.css
        echo "All frontend files present and validated."

    - name: Validate Database Security Rules & Cloud Functions
      run: |
        test -f database/firestore.rules
        test -f database/firestore.indexes.json
        test -f backend/functions/index.js
        echo "Backend functions and database rules validated."
