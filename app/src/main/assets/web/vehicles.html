<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vehicle Management - AutoPollution Manager Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e6f42">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="header-bar">
    <div class="brand-wrapper" onclick="window.location.href='dashboard.html'">
      <div class="brand-logo-badge">🚗</div>
      <div>
        <div class="brand-title">Vehicles & PUC Records</div>
        <div class="brand-sub">AutoPollution Pro</div>
      </div>
    </div>
    
    <div class="header-nav-links">
      <a href="dashboard.html" style="color:rgba(255,255,255,0.85); text-decoration:none; font-size:0.88rem;">Dashboard</a>
      <a href="vehicles.html" style="color:white; font-weight:700; text-decoration:none; font-size:0.88rem;">Vehicles</a>
      <a href="reminders.html" style="color:rgba(255,255,255,0.85); text-decoration:none; font-size:0.88rem;">Reminders</a>
      <a href="subscription.html" style="color:rgba(255,255,255,0.85); text-decoration:none; font-size:0.88rem;">Subscription</a>
      <a href="settings.html" style="color:rgba(255,255,255,0.85); text-decoration:none; font-size:0.88rem;">Settings</a>
    </div>

    <div class="header-right">
      <span id="headerTenantBadge" class="badge-tenant">Loading...</span>
      <button class="icon-btn" onclick="window.location.href='dashboard.html'" title="Home">🏠</button>
    </div>
  </header>

  <main class="container">
    
    <!-- Top Action Row -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
      <div>
        <h1 style="font-size:1.35rem; font-weight:800; color:var(--primary-dark);">Vehicle Registry</h1>
        <p style="font-size:0.82rem; color:var(--text-muted);">
          Total: <strong id="vehicleCountSummary">0</strong> vehicles registered in your centre
        </p>
      </div>
      <div style="display:flex; gap:8px;">
        <button onclick="exportVehiclesToCSV()" class="btn btn-secondary btn-sm" title="Export CSV">
          <span>📥</span> Export CSV
        </button>
        <a href="add-vehicle.html" class="btn btn-primary btn-sm">
          <span>➕</span> Add Vehicle
        </a>
      </div>
    </div>

    <!-- Search & Filter Component -->
    <div class="search-filter-box">
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="vehicleSearchInput" class="search-input" placeholder="Search by Vehicle Number, Owner Name, or Mobile..." oninput="handleSearchFilter()">
      </div>

      <div class="filter-pills">
        <button class="pill active" onclick="setFilter('all', this)">All Vehicles</button>
        <button class="pill" onclick="setFilter('expiring_30', this)">Expiring Soon (30d)</button>
        <button class="pill" onclick="setFilter('expiring_7', this)">Expiring in 7 Days</button>
        <button class="pill" onclick="setFilter('expired', this)">Expired PUC</button>
        <button class="pill" onclick="setFilter('active', this)">Active PUC</button>
      </div>
    </div>

    <!-- Vehicle Card / List Container -->
    <div id="vehicleContainer" class="vehicle-list">
      <!-- Injected by JavaScript -->
    </div>

  </main>

  <!-- Bottom Navigation Bar for Mobile -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <span class="nav-icon">📊</span>
      <span>Dashboard</span>
    </a>
    <a href="vehicles.html" class="nav-item active">
      <span class="nav-icon">🚗</span>
      <span>Vehicles</span>
    </a>
    <a href="add-vehicle.html" class="nav-item">
      <span class="nav-icon">➕</span>
      <span>Add</span>
    </a>
    <a href="reminders.html" class="nav-item">
      <span class="nav-icon">💬</span>
      <span>Reminders</span>
    </a>
    <a href="settings.html" class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span>Settings</span>
    </a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = AppAuth.requireAuth('centre');
    let currentFilter = 'all';

    // Parse URL param filter e.g. ?filter=expired
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('filter')) {
      currentFilter = urlParams.get('filter');
    }

    function setFilter(filterType, btnEl) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-pills .pill').forEach(p => p.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      renderVehicles();
    }

    function handleSearchFilter() {
      renderVehicles();
    }

    function renderVehicles() {
      const centreId = session.id;
      let vehicles = AppDB.getVehicles(centreId);
      const query = (document.getElementById('vehicleSearchInput').value || '').trim().toLowerCase();

      document.getElementById('vehicleCountSummary').textContent = vehicles.length;

      // Filter by category
      if (currentFilter !== 'all') {
        vehicles = vehicles.filter(v => {
          const st = AppDB.getExpiryStatus(v.expDate);
          if (currentFilter === 'expired') return st.status === 'expired';
          if (currentFilter === 'expiring_30') return st.status.includes('expiring');
          if (currentFilter === 'expiring_7') return st.status.includes('expiring') && st.days <= 7;
          if (currentFilter === 'active') return st.status === 'active';
          return true;
        });
      }

      // Filter by text search
      if (query) {
        vehicles = vehicles.filter(v => 
          (v.vno && v.vno.toLowerCase().includes(query)) ||
          (v.owner && v.owner.toLowerCase().includes(query)) ||
          (v.phone && v.phone.includes(query)) ||
          (v.pucNo && v.pucNo.toLowerCase().includes(query))
        );
      }

      const container = document.getElementById('vehicleContainer');

      if (vehicles.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🚗</div>
            <div class="empty-title">No matching vehicle records found</div>
            <div class="empty-desc">Try clearing the search box or changing your filter criteria.</div>
            <a href="add-vehicle.html" class="btn btn-primary btn-sm">➕ Add New Vehicle</a>
          </div>
        `;
        return;
      }

      // Render cards
      container.innerHTML = vehicles.map(v => {
        const expStatus = AppDB.getExpiryStatus(v.expDate);
        const statusClass = expStatus.status === 'expired' ? 'status-expired' : (expStatus.status.includes('expiring') ? 'status-expiring' : 'status-active');
        const countdownClass = expStatus.status === 'expired' ? 'red' : (expStatus.status.includes('expiring') ? 'amber' : 'green');

        return `
          <div class="vehicle-card ${statusClass}">
            <div class="vehicle-main-row">
              <div>
                <span class="vehicle-reg-tag">${v.vno}</span>
                <span class="vehicle-type-badge">${v.vtype || 'Vehicle'}</span>
                <div class="vehicle-owner">${v.owner}</div>
              </div>
              <div style="text-align:right;">
                <span class="expiry-countdown ${countdownClass}">${expStatus.label}</span>
                <div style="font-size:0.75rem; color:var(--text-muted); margin-top:2px;">Expiry: ${v.expDate || 'N/A'}</div>
              </div>
            </div>

            <div class="vehicle-meta-grid">
              <div>
                <span class="meta-label">Customer Mobile</span>
                <span class="meta-val">📞 ${v.phone}</span>
              </div>
              <div>
                <span class="meta-label">WhatsApp Number</span>
                <span class="meta-val">💬 ${v.whatsapp || v.phone}</span>
              </div>
              <div>
                <span class="meta-label">Fuel / PUC Cert No</span>
                <span class="meta-val">⛽ ${v.fuelType || 'Petrol'} / ${v.pucNo || 'N/A'}</span>
              </div>
              <div>
                <span class="meta-label">Reminders Sent</span>
                <span class="meta-val">🔔 ${v.remindersCount || 0} times ${v.lastReminderDate ? `<span style="font-size:0.7rem; color:var(--text-muted);">(${new Date(v.lastReminderDate).toLocaleDateString('en-IN')})</span>` : ''}</span>
              </div>
            </div>

            ${v.notes ? `<div style="font-size:0.78rem; color:#475569; background:#f1f5f9; padding:4px 8px; border-radius:4px;">📝 Note: ${v.notes}</div>` : ''}

            <!-- One-Click WhatsApp & SMS (Free Software Feature) -->
            <div class="vehicle-actions">
              <button class="btn btn-wa btn-sm" onclick='RemindersController.openMessagePreview(${JSON.stringify(v).replace(/'/g, "&#39;")}, "whatsapp")' title="Free One-Click WhatsApp">
                <span>💬</span> WhatsApp
              </button>
              <button class="btn btn-sms btn-sm" onclick='RemindersController.openMessagePreview(${JSON.stringify(v).replace(/'/g, "&#39;")}, "sms")' title="Free One-Click SMS">
                <span>✉️</span> SMS
              </button>
              <a href="add-vehicle.html?edit=${v.id}" class="btn btn-secondary btn-sm" title="Edit Vehicle">
                <span>✏️</span> Edit
              </a>
              <button class="btn btn-danger btn-sm" onclick="handleDeleteVehicle('${v.id}', '${v.vno}')" title="Delete Vehicle">
                <span>🗑️</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleDeleteVehicle(id, vno) {
      confirmAction('Delete Vehicle Record', `Are you sure you want to permanently delete vehicle "${vno}"? This action cannot be undone.`, () => {
        AppDB.deleteVehicle(id, session.id);
        showToast(`Vehicle ${vno} deleted successfully!`, 'info');
        renderVehicles();
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      // Highlight initial filter button if matched
      document.querySelectorAll('.filter-pills .pill').forEach(btn => {
        if (btn.getAttribute('onclick').includes(`'${currentFilter}'`)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      renderVehicles();
    });
  </script>
</body>
</html>
