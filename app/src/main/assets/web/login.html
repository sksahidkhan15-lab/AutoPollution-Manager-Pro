<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - AutoPollution Manager Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e6f42">
</head>
<body style="background:linear-gradient(180deg, #0e6f42 0%, #15803d 40%, #f4f7f5 40%, #f4f7f5 100%);">

  <div class="container" style="max-width:440px; margin-top:20px;">
    
    <div style="text-align:center; color:white; margin-bottom:24px;">
      <div class="brand-logo-badge" style="margin:0 auto 10px auto; width:52px; height:52px; font-size:28px;">🚗</div>
      <h1 style="font-size:1.5rem; font-weight:800;">AutoPollution Pro</h1>
      <p style="font-size:0.85rem; opacity:0.9;">Commercial SaaS for Pollution Testing Centres</p>
    </div>

    <div class="form-card" style="box-shadow:var(--shadow-lg); padding:24px;">
      
      <!-- Tabs: Centre Login vs Super Admin -->
      <div style="display:flex; border-bottom:2px solid var(--border-color); margin-bottom:20px;">
        <button id="tabCentre" class="btn" style="flex:1; border-radius:0; border-bottom:2px solid var(--primary); color:var(--primary); font-weight:700; background:transparent;" onclick="switchLoginTab('centre')">
          🏢 Centre Login
        </button>
        <button id="tabAdmin" class="btn" style="flex:1; border-radius:0; border-bottom:2px solid transparent; color:var(--text-muted); font-weight:600; background:transparent;" onclick="switchLoginTab('admin')">
          🛡️ Super Admin
        </button>
      </div>

      <div id="loginAlertBox" style="display:none; margin-bottom:16px;" class="alert-banner danger"></div>

      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        
        <div class="form-group">
          <label class="form-label" id="lblIdentifier">Mobile Number / Email / Centre ID</label>
          <input type="text" id="loginIdentifier" class="form-control" placeholder="e.g. 9876543210 or WB-PUC-7801" required autofocus>
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label class="form-label" style="margin-bottom:0;">Password</label>
            <a href="javascript:void(0)" onclick="handleForgotPassword()" style="font-size:0.78rem; color:var(--primary); font-weight:600;">Forgot Password?</a>
          </div>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
        </div>

        <div class="form-group" style="display:flex; justify-content:space-between; align-items:center;">
          <label class="form-check">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember this device</span>
          </label>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width:100%; padding:12px; font-size:1rem; font-weight:700;">
          Sign In
        </button>

      </form>

      <!-- Quick Demo Login Buttons -->
      <div style="margin-top:20px; padding-top:16px; border-top:1px dashed var(--border-color); text-align:center;">
        <div style="font-size:0.75rem; color:var(--text-muted); font-weight:600; margin-bottom:8px; text-transform:uppercase;">
          ⚡ 1-Click Demo Accounts
        </div>
        <div style="display:flex; gap:8px; flex-direction:column;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('9876543210', '123456', 'centre')" style="font-size:0.8rem; justify-content:flex-start;">
            <span>🏢</span> <strong>Maa Tara Centre</strong> (Approved Centre demo)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('9811223344', '123456', 'centre')" style="font-size:0.8rem; justify-content:flex-start;">
            <span>⏳</span> <strong>Capital Green Centre</strong> (Pending approval test)
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="quickFill('admin@autopollution.com', 'Admin@123', 'admin')" style="font-size:0.8rem; justify-content:flex-start;">
            <span>🛡️</span> <strong>Super Administrator</strong> (Master admin portal)
          </button>
        </div>
      </div>

      <div style="margin-top:20px; text-align:center; font-size:0.88rem;">
        New Pollution Testing Centre? <a href="register.html" style="color:var(--primary); font-weight:700;">Register Here</a>
      </div>

    </div>

    <div style="text-align:center; margin-top:16px;">
      <a href="index.html" style="color:var(--text-muted); font-size:0.82rem; text-decoration:none;">&larr; Back to Public Website</a>
    </div>

  </div>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentRole = 'centre';

    function switchLoginTab(role) {
      currentRole = role;
      const tabCentre = document.getElementById('tabCentre');
      const tabAdmin = document.getElementById('tabAdmin');
      const lblIdentifier = document.getElementById('lblIdentifier');
      const identInput = document.getElementById('loginIdentifier');
      const passInput = document.getElementById('loginPassword');
      const alertBox = document.getElementById('loginAlertBox');
      alertBox.style.display = 'none';

      if (role === 'admin') {
        tabAdmin.style.borderBottom = '2px solid var(--danger)';
        tabAdmin.style.color = 'var(--danger)';
        tabCentre.style.borderBottom = '2px solid transparent';
        tabCentre.style.color = 'var(--text-muted)';
        lblIdentifier.textContent = 'Super Admin Email / Username';
        identInput.placeholder = 'admin@autopollution.com';
        identInput.value = 'admin@autopollution.com';
        passInput.value = 'Admin@123';
      } else {
        tabCentre.style.borderBottom = '2px solid var(--primary)';
        tabCentre.style.color = 'var(--primary)';
        tabAdmin.style.borderBottom = '2px solid transparent';
        tabAdmin.style.color = 'var(--text-muted)';
        lblIdentifier.textContent = 'Mobile Number / Email / Centre ID';
        identInput.placeholder = 'e.g. 9876543210 or WB-PUC-7801';
        identInput.value = '9876543210';
        passInput.value = '123456';
      }
    }

    function quickFill(identifier, pass, role) {
      switchLoginTab(role);
      document.getElementById('loginIdentifier').value = identifier;
      document.getElementById('loginPassword').value = pass;
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const identifier = document.getElementById('loginIdentifier').value;
      const password = document.getElementById('loginPassword').value;
      const alertBox = document.getElementById('loginAlertBox');
      const submitBtn = document.getElementById('loginSubmitBtn');
      alertBox.style.display = 'none';

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying credentials...';

      setTimeout(() => {
        try {
          const session = AppAuth.login(identifier, password, currentRole === 'admin');
          showToast(`Welcome back, ${session.name}!`, 'success');
          if (session.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'dashboard.html';
          }
        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          alertBox.style.display = 'block';
          if (err.code === 'PENDING_APPROVAL') {
            alertBox.className = 'alert-banner';
            alertBox.innerHTML = `<strong>⏳ PENDING APPROVAL:</strong><br>${err.message}<br><br><small>Super Admin can approve this centre in the <a href="admin.html" style="font-weight:700; color:var(--primary);">Super Admin Portal</a>.</small>`;
          } else {
            alertBox.className = 'alert-banner danger';
            alertBox.innerHTML = `<strong>⚠️ Authentication Failed:</strong> ${err.message}`;
          }
        }
      }, 400);
    }

    function handleForgotPassword() {
      const emailOrPhone = prompt('Enter your registered Mobile Number or Email to receive password reset OTP:');
      if (emailOrPhone) {
        showToast(`Password reset link sent to ${emailOrPhone}! (Demo Mode: Password is "123456")`, 'success');
      }
    }

    // Check if already logged in
    const existing = AppAuth.getSession();
    if (existing) {
      if (existing.role === 'admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
