<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Add / Edit Vehicle - AutoPollution Manager Pro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e6f42">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="header-bar">
    <div class="brand-wrapper" onclick="window.location.href='vehicles.html'">
      <div class="brand-logo-badge">🚗</div>
      <div>
        <div class="brand-title" id="pageTitle">Add New Vehicle</div>
        <div class="brand-sub">AutoPollution Pro</div>
      </div>
    </div>
    <div class="header-right">
      <a href="vehicles.html" class="btn btn-secondary btn-sm" style="background:rgba(255,255,255,0.2); color:#ffffff;">Cancel</a>
    </div>
  </header>

  <main class="container" style="max-width:680px;">
    
    <div class="form-card">
      <form id="vehicleForm" onsubmit="handleVehicleSubmit(event)">
        
        <!-- Registration & Owner -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Vehicle Registration Number *</label>
            <input type="text" id="vRegNo" class="form-control" placeholder="e.g. WB02AL4589 or DL01AB1234" style="text-transform:uppercase; font-weight:700; letter-spacing:0.8px;" required autofocus>
            <small style="color:var(--text-muted); font-size:0.72rem;">Automatically converted to uppercase. Indian standard format.</small>
          </div>
          <div class="form-group">
            <label class="form-label">Vehicle Owner Full Name *</label>
            <input type="text" id="vOwner" class="form-control" placeholder="e.g. Arun Kumar Mukherjee" required>
          </div>
        </div>

        <!-- Mobile & WhatsApp Numbers -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Customer Mobile Number * (10 Digits)</label>
            <input type="tel" id="vPhone" class="form-control" placeholder="e.g. 9830112233" maxlength="10" required>
          </div>
          <div class="form-group">
            <label class="form-label">WhatsApp Number</label>
            <input type="tel" id="vWhatsApp" class="form-control" placeholder="e.g. 9830112233" maxlength="10">
            <label class="form-check" style="margin-top:6px;">
              <input type="checkbox" id="chkSameMobile" checked onchange="handleSyncWhatsApp()">
              <span style="font-size:0.75rem;">Same as Mobile Number</span>
            </label>
          </div>
        </div>

        <!-- Vehicle Type & Fuel -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Vehicle Type *</label>
            <select id="vType" class="form-control" required>
              <option value="4W - Car">4 Wheeler (Car / SUV / Van)</option>
              <option value="2W - Motorcycle">2 Wheeler (Motorcycle / Scooter)</option>
              <option value="3W - Auto">3 Wheeler (Auto Rickshaw / Cargo)</option>
              <option value="LCV - Commercial">Light Commercial Vehicle (LCV / Pickup)</option>
              <option value="HCV - Commercial">Heavy Commercial Vehicle (HCV / Truck)</option>
              <option value="Bus">Bus / Coach</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Fuel Type *</label>
            <select id="vFuel" class="form-control" required>
              <option value="Petrol">Petrol</option>
              <option value="Diesel">Diesel</option>
              <option value="CNG">CNG</option>
              <option value="LPG">LPG</option>
              <option value="Hybrid">Hybrid / Electric</option>
            </select>
          </div>
        </div>

        <!-- PUC Certificate No & Registration Date -->
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">PUC Certificate Number</label>
            <input type="text" id="vPucNo" class="form-control" placeholder="e.g. WB02260012398">
          </div>
          <div class="form-group">
            <label class="form-label">PUC Issue / Test Date</label>
            <input type="date" id="vRegDate" class="form-control" required>
          </div>
        </div>

        <!-- PUC Expiry Date with Quick Preset Buttons -->
        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="form-label" style="margin-bottom:0;">PUC Expiry Date *</label>
            <div class="quick-date-btns">
              <button type="button" class="quick-date-btn" onclick="setQuickExpiry(6)">+ 6 Months</button>
              <button type="button" class="quick-date-btn" onclick="setQuickExpiry(12)">+ 1 Year</button>
            </div>
          </div>
          <input type="date" id="vExpDate" class="form-control" style="margin-top:6px;" required>
          <small style="color:var(--text-muted); font-size:0.75rem;">BS-IV & BS-VI petrol/diesel cars typically receive 1-year validity, older vehicles 6 months.</small>
        </div>

        <!-- Customer Consent & Notes -->
        <div class="form-group">
          <label class="form-label">Additional Notes / Remarks</label>
          <input type="text" id="vNotes" class="form-control" placeholder="e.g. 4-Gas Analyzer Reading: CO 0.12%, HC 85 ppm">
        </div>

        <div class="form-group" style="background:#f0fdf4; border:1px solid #bbf7d0; padding:10px 14px; border-radius:8px;">
          <label class="form-check">
            <input type="checkbox" id="vConsent" checked>
            <span style="font-size:0.82rem; font-weight:600; color:var(--primary-dark);">
              Customer Consent Verified: Customer has agreed to receive automated WhatsApp & SMS PUC renewal alerts from this centre (TRAI / DLT compliance).
            </span>
          </label>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
          <a href="vehicles.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" id="btnSubmitVehicle" class="btn btn-primary" style="padding:12px 24px; font-weight:700;">
            💾 Save Vehicle Record
          </button>
        </div>

      </form>
    </div>

  </main>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = AppAuth.requireAuth('centre');
    let editVehicleId = null;

    formatVehicleNumber(document.getElementById('vRegNo'));
    formatMobileNumber(document.getElementById('vPhone'));
    formatMobileNumber(document.getElementById('vWhatsApp'));

    // Check if Edit mode
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('edit')) {
      editVehicleId = urlParams.get('edit');
      document.getElementById('pageTitle').textContent = 'Edit Vehicle Record';
    }

    function handleSyncWhatsApp() {
      const chk = document.getElementById('chkSameMobile');
      const phone = document.getElementById('vPhone').value;
      const waInput = document.getElementById('vWhatsApp');
      if (chk.checked) {
        waInput.value = phone;
      }
    }

    document.getElementById('vPhone').addEventListener('input', () => {
      if (document.getElementById('chkSameMobile').checked) {
        document.getElementById('vWhatsApp').value = document.getElementById('vPhone').value;
      }
    });

    function setQuickExpiry(months) {
      const regDateVal = document.getElementById('vRegDate').value;
      const baseDate = regDateVal ? new Date(regDateVal) : new Date();
      const expDate = new Date(baseDate);
      expDate.setMonth(expDate.getMonth() + months);
      // Format to YYYY-MM-DD
      const y = expDate.getFullYear();
      const m = String(expDate.getMonth() + 1).padStart(2, '0');
      const d = String(expDate.getDate()).padStart(2, '0');
      document.getElementById('vExpDate').value = `${y}-${m}-${d}`;
    }

    // Populate default today for registration date
    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('vRegDate').value = todayStr;
    setQuickExpiry(12); // Default 1 year validity

    // If Editing existing vehicle, load record
    if (editVehicleId) {
      const vehicles = AppDB.getVehicles(session.id);
      const v = vehicles.find(item => item.id === editVehicleId);
      if (v) {
        document.getElementById('vRegNo').value = v.vno;
        document.getElementById('vOwner').value = v.owner;
        document.getElementById('vPhone').value = v.phone;
        document.getElementById('vWhatsApp').value = v.whatsapp || v.phone;
        document.getElementById('vType').value = v.vtype || '4W - Car';
        document.getElementById('vFuel').value = v.fuelType || 'Petrol';
        document.getElementById('vPucNo').value = v.pucNo || '';
        document.getElementById('vRegDate').value = v.regDate || todayStr;
        document.getElementById('vExpDate').value = v.expDate || '';
        document.getElementById('vNotes').value = v.notes || '';
        document.getElementById('vConsent').checked = v.consentGiven !== false;
      }
    }

    function handleVehicleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitVehicle');
      btn.disabled = true;
      btn.textContent = 'Saving vehicle...';

      const vehicleData = {
        vno: document.getElementById('vRegNo').value,
        owner: document.getElementById('vOwner').value.trim(),
        phone: document.getElementById('vPhone').value.trim(),
        whatsapp: document.getElementById('vWhatsApp').value.trim() || document.getElementById('vPhone').value.trim(),
        vtype: document.getElementById('vType').value,
        fuelType: document.getElementById('vFuel').value,
        pucNo: document.getElementById('vPucNo').value.trim(),
        regDate: document.getElementById('vRegDate').value,
        expDate: document.getElementById('vExpDate').value,
        notes: document.getElementById('vNotes').value.trim(),
        consentGiven: document.getElementById('vConsent').checked,
        consentDate: new Date().toISOString()
      };

      try {
        if (editVehicleId) {
          AppDB.updateVehicle(editVehicleId, vehicleData, session.id);
          showToast(`Vehicle ${vehicleData.vno} updated successfully!`, 'success');
        } else {
          AppDB.addVehicle(vehicleData, session.id);
          showToast(`Vehicle ${vehicleData.vno} registered successfully!`, 'success');
        }
        setTimeout(() => {
          window.location.href = 'vehicles.html';
        }, 350);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = '💾 Save Vehicle Record';
        showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
